buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.10"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Configure release CMake builds without debug info (Release instead of RelWithDebInfo),
// use ccache when available, and keep VisionCameraBarcodeScanner under Ninja's CMAKE_OBJECT_PATH_MAX on Windows.
def isWindowsHost = System.getProperty("os.name", "").toLowerCase(Locale.ROOT).contains("win")
def hasCcache = !isWindowsHost && new File("/usr/bin/ccache").canExecute()
subprojects { subproject ->
  subproject.pluginManager.withPlugin("com.android.library") {
    subproject.android.buildTypes.release.externalNativeBuild.cmake.arguments.add("-DCMAKE_BUILD_TYPE=Release")
    if (hasCcache) {
      subproject.android.defaultConfig.externalNativeBuild.cmake.arguments.addAll([
        "-DCMAKE_C_COMPILER_LAUNCHER=ccache",
        "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache",
      ])
    }
    if (isWindowsHost && subproject.name == "react-native-vision-camera-barcode-scanner") {
      def staging = new File("C:/cxx/vcbs")
      subproject.android.externalNativeBuild.cmake.buildStagingDirectory = staging
      println "[WebWrap] barcode-scanner CMake staging -> ${staging}"
    }
  }
  subproject.pluginManager.withPlugin("com.android.application") {
    if (hasCcache) {
      subproject.android.defaultConfig.externalNativeBuild.cmake.arguments.addAll([
        "-DCMAKE_C_COMPILER_LAUNCHER=ccache",
        "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache",
      ])
    }
  }
}
