name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 26
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Android NDK and Build-Tools
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/27.1.12297006
            /usr/local/lib/android/sdk/build-tools/37.0.0
            /usr/local/lib/android/sdk/platforms/android-37
          key: ${{ runner.os }}-android-sdk-ndk27.1-bt37

      - name: Restore Android NDK and Build-Tools cache
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v6
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/27.1.12297006
            /usr/local/lib/android/sdk/build-tools/37.0.0
            /usr/local/lib/android/sdk/platforms/android-37
          key: ${{ runner.os }}-android-sdk-ndk27.1-bt37

      - name: Set up ccache for C++/NDK builds
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-ccache-
          save: ${{ github.ref == 'refs/heads/main' }}
          max-size: 2G

      - name: Cache Gradle packages and wrapper
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v3-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'package-lock.json', 'android/build.gradle', 'android/app/build.gradle', 'android/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-v3-
            ${{ runner.os }}-gradle-v2-

      - name: Restore Gradle packages and wrapper cache
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v3-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'package-lock.json', 'android/build.gradle', 'android/app/build.gradle', 'android/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-v3-
            ${{ runner.os }}-gradle-v2-

      - name: Cache native CMake/NDK build outputs
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v6
        with:
          path: |
            android/app/.cxx
            node_modules/**/android/.cxx
          key: ${{ runner.os }}-cxx-v3-${{ hashFiles('package-lock.json', 'android/build.gradle', 'android/app/build.gradle', 'android/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-cxx-v3-
            ${{ runner.os }}-cxx-v2-

      - name: Restore native CMake/NDK build outputs cache
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v6
        with:
          path: |
            android/app/.cxx
            node_modules/**/android/.cxx
          key: ${{ runner.os }}-cxx-v3-${{ hashFiles('package-lock.json', 'android/build.gradle', 'android/app/build.gradle', 'android/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-cxx-v3-
            ${{ runner.os }}-cxx-v2-

      - name: Accept Android SDK licenses
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Build release APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --parallel --build-cache -x lint -x lintVitalRelease --stacktrace \
            -Dorg.gradle.internal.http.connectionTimeout=120000 \
            -Dorg.gradle.internal.http.socketTimeout=120000
          rm -f ~/.gradle/caches/modules-2/modules-2.lock
          rm -fr ~/.gradle/caches/*/plugin-resolution/

      - name: Stage stable APK filenames
        run: |
          mkdir -p release-apks
          for apk in android/app/build/outputs/apk/release/*.apk; do
            base="$(basename "$apk")"
            stable="$(echo "$base" | sed -E 's/-[0-9]{10}\.apk$/.apk/')"
            cp "$apk" "release-apks/$stable"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: webwrap-release-apks
          path: release-apks/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: release-apks/*.apk
          generate_release_notes: true
