name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 26
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: 'enhanced'
          cache-cleanup: 'on-success'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install npm dependencies
        run: npm ci

      - name: Cache native CMake/NDK build outputs
        uses: actions/cache@v6
        with:
          path: |
            android/app/.cxx
            node_modules/**/android/.cxx
          key: ${{ runner.os }}-cxx-${{ hashFiles('package-lock.json', 'android/build.gradle', 'android/app/build.gradle', 'android/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-cxx-

      - name: Accept Android SDK licenses
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Build release APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --build-cache

      - name: Stage stable APK filenames
        run: |
          mkdir -p release-apks
          for apk in android/app/build/outputs/apk/release/*.apk; do
            base="$(basename "$apk")"
            stable="$(echo "$base" | sed -E 's/-[0-9]{10}\.apk$/.apk/')"
            cp "$apk" "release-apks/$stable"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: webwrap-release-apks
          path: release-apks/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: release-apks/*.apk
          generate_release_notes: true
